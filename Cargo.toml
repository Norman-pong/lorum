[package]
name = "lorum"
version = "0.1.3-alpha.1"
edition = "2024"
rust-version = "1.85.0"
description = "Unified MCP configuration manager for AI coding tools"
license = "MIT"
repository = "https://github.com/Norman-pong/lorum"
homepage = "https://github.com/Norman-pong/lorum"
documentation = "https://docs.rs/lorum"
keywords = ["mcp", "cli", "ai", "configuration", "tools"]
categories = ["command-line-utilities", "config"]
authors = ["Norman-pong"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
dirs = "6"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
