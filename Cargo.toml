[package]
name = "lorum"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Unified MCP configuration manager for AI coding tools"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
dirs = "6"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
